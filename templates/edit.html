{% extends "base.html" %}
{% block content %}

<h1 class="text-center mt-4 mb-4">Editar Prenda</h1>

<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6 mb-3">
        <div class="card shadow">
            <div class="card-header text-center">
                <h5>Modificar Prenda</h5>
            </div>
            <div class="card-body">
                <form action="/products/{{ product._id }}/edit" method="POST">

                    <label>Nombre</label>
                    <input type="text" class="form-control mb-3" name="name" value="{{ product.name }}">

                    <label>Descripción</label>
                    <input type="text" class="form-control mb-3" name="description" value="{{ product.description }}">

                    <label>Precio</label>
                    <input type="hidden" name="price" value="100">

                    <label>Cantidad</label>
                    <input type="number" class="form-control mb-3" name="stock" value="{{ product.stock }}">

                    <label>Categoría</label>
                    <select class="form-select mb-3" name="category">
                        <option value="Caballeros" {% if product.category == 'Caballeros' %}selected{% endif %}>Caballeros</option>
                        <option value="Damas" {% if product.category == 'Damas' %}selected{% endif %}>Damas</option>
                        <option value="Niños" {% if product.category == 'Niños' %}selected{% endif %}>Niños</option>
                    </select>

                    <button class="btn btn-primary w-100" type="submit">Guardar Cambios</button>
                    <a href="{{ url_for('buscar_filtrar_bp.buscar_y_filtrar') }}" class="btn btn-secondary w-100 mt-2">Cancelar</a>

                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
